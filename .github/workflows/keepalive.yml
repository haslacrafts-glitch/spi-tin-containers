name: Keep Supabase awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive
        env:
          URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Set GitHub secret KEEPALIVE_URL to https://YOUR-SITE/api/keepalive"
            exit 0
          fi
          curl -fsS "$URL"
